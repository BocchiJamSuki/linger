name: Release

# Pushing a tag such as v1.0.0 tests, builds the executable, and publishes it as a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python -m PyInstaller --noconfirm linger.spec
      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item LICENSE, README.md, README.zh-CN.md dist/Linger/
          Compress-Archive -Path dist/Linger -DestinationPath "Linger-$version-win64.zip"
          "ASSET=Linger-$version-win64.zip" >> $env:GITHUB_ENV
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ASSET" --title "Linger ${{ github.ref_name }}" --notes-file docs/release-notes.md
